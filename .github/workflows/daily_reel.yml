name: Daily Reel

# Runs once a day (default 05:30 UTC = 11:00 IST).
# Free tier: GitHub Actions gives 2,000 minutes/month free (public and
# private repos) — this job uses ~5-10 minutes per run.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg + Tesseract (free)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr

      - name: Install Python deps (free, open source)
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        id: run
        continue-on-error: true
        run: python src/pipeline.py run
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Render dashboard (always)
        if: always()
        run: python src/pipeline.py dashboard || true

      - name: Commit status back to repo (always)
        if: always()
        run: |
          git config user.name "wfb-bot"
          git config user.email "wfb-bot@users.noreply.github.com"
          git add dashboard.html logs/notifications.md database/content.json database/history.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "wfb: status update $(date -u +%F)"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
          fi
        continue-on-error: true

      - name: Upload artifacts (image, video, caption, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wfb-latest
          path: |
            dashboard.html
            generated/
            captions/
            logs/
          if-no-files-found: ignore

      - name: Open a GitHub issue on failure (free alert)
        if: steps.run.outcome == 'failure'
        run: |
          python - <<'EOF'
          import json, os, urllib.request
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/issues"
          req = urllib.request.Request(
              url,
              data=json.dumps({
                  "title": "wfb: today's pipeline needs attention",
                  "body": "The daily reel job failed or needs manual action.\n\nCheck: dashboard.html (latest commit), logs/notifications.md, and the `wfb-latest` artifact of this run.",
                  "labels": ["needs-attention"],
              }).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              },
          )
          try:
              urllib.request.urlopen(req, timeout=30)
              print("issue created")
          except Exception as e:
              print(f"could not create issue: {e}")
          EOF
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
